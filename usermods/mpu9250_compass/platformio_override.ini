;; Example platformio_override.ini to enable the MPU-9250 Compass usermod.
;; Copy this file to your WLED checkout root as "platformio_override.ini"
;; (or merge the [env:...] section into an existing override file) and
;; uncomment the environment you want to build.

[platformio]
; default_envs = compass_esp32

;; ESP32 (classic) - extends the stock esp32dev env, only adds this usermod
[env:compass_esp32]
extends = env:esp32dev
custom_usermods = mpu9250_compass

;; ESP32-S3 - extends the stock esp32s3 env, only adds this usermod
[env:compass_esp32s3]
extends = env:esp32s3dev_8MB_qspi
custom_usermods = mpu9250_compass
